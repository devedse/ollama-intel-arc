name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Ollama version to build (e.g. 0.17.7). Leave empty for latest GitHub release.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sycl-ollama

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Ollama version
        id: ollama
        run: |
          INPUT_VERSION="${{ github.event.inputs.ollama_version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(curl -sL https://api.github.com/repos/ollama/ollama/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Ollama version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # The sycl-ollama build (oneAPI + compile) needs significant disk space.
      # Free up space on the GitHub runner to avoid running out during build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghcrel
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag as "latest" and the resolved Ollama version
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.ollama.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            # Branch name (for feature branch builds)
            type=ref,event=branch
            # PR number
            type=ref,event=pr
            # Short SHA (always)
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sycl-ollama
          file: ./sycl-ollama/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OLLAMA_VERSION=${{ steps.ollama.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
