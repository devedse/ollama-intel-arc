name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Ollama version to build (e.g. 0.17.7). Leave empty for latest GitHub release.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sycl-ollama

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Ollama version
        id: ollama
        run: |
          INPUT_VERSION="${{ github.event.inputs.ollama_version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(curl -sL https://api.github.com/repos/ollama/ollama/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Ollama version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Determine compatible ggml-sycl commit
        id: ggml
        run: |
          OLLAMA_VERSION="${{ steps.ollama.outputs.version }}"

          # Clone ollama to inspect its vendored ggml headers
          git clone --depth 1 --branch "v${OLLAMA_VERSION}" \
            https://github.com/ollama/ollama.git /tmp/ollama

          # Compute blob hashes of the ggml headers that define the API surface.
          # We need these to match: ggml.h has enums/ops, ggml-common.h has types.
          GGML_H_HASH=$(git hash-object /tmp/ollama/ml/backend/ggml/ggml/include/ggml.h)
          COMMON_H_HASH=$(git hash-object /tmp/ollama/ml/backend/ggml/ggml/src/ggml-common.h)
          echo "ggml.h blob: ${GGML_H_HASH}"
          echo "ggml-common.h blob: ${COMMON_H_HASH}"

          # Clone llama.cpp tree history (blobless = fast, no file content downloaded)
          git clone --filter=blob:none --no-checkout \
            https://github.com/ggml-org/llama.cpp.git /tmp/llama

          # Find the most recent llama.cpp commit where both headers are byte-identical
          # to ollama's vendored copies. This guarantees ggml-sycl API compatibility.
          GGML_COMMIT=""
          for commit in $(git -C /tmp/llama log --format=%H -500 \
              -- ggml/include/ggml.h ggml/src/ggml-common.h); do
            b1=$(git -C /tmp/llama ls-tree "$commit" -- ggml/include/ggml.h 2>/dev/null | awk '{print $3}')
            b2=$(git -C /tmp/llama ls-tree "$commit" -- ggml/src/ggml-common.h 2>/dev/null | awk '{print $3}')
            if [ "$b1" = "$GGML_H_HASH" ] && [ "$b2" = "$COMMON_H_HASH" ]; then
              GGML_COMMIT="$commit"
              break
            fi
          done

          if [ -z "$GGML_COMMIT" ]; then
            echo "::error::Could not find a compatible llama.cpp commit for ollama v${OLLAMA_VERSION}"
            exit 1
          fi

          echo "Compatible ggml-sycl commit: ${GGML_COMMIT}"
          echo "commit=${GGML_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "### ggml-sycl commit: \`${GGML_COMMIT}\`" >> "$GITHUB_STEP_SUMMARY"
          rm -rf /tmp/ollama /tmp/llama

      # The sycl-ollama build (oneAPI + compile) needs significant disk space.
      # Free up space on the GitHub runner to avoid running out during build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghcrel
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag as "latest" and the resolved Ollama version
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.ollama.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            # Branch name (for feature branch builds)
            type=ref,event=branch
            # PR number
            type=ref,event=pr
            # Short SHA (always)
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sycl-ollama
          file: ./sycl-ollama/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OLLAMA_VERSION=${{ steps.ollama.outputs.version }}
            GGML_COMMIT=${{ steps.ggml.outputs.commit }}
